<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Publicar Viaje - U-Ride</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-primary": "#006f16",
                      "on-surface": "#ffffff",
                      "secondary-fixed-dim": "#7aeb9d",
                      "tertiary-dim": "#00dbec",
                      "surface-container-highest": "#262626",
                      "primary": "#9cff93",
                      "on-tertiary": "#005b63",
                      "on-tertiary-fixed-variant": "#005c64",
                      "surface-container": "#1a1919",
                      "background": "#0e0e0e",
                      "on-background": "#ffffff",
                      "on-tertiary-fixed": "#003d42",
                      "on-tertiary-container": "#005159",
                      "surface-container-high": "#201f1f",
                      "tertiary-fixed": "#0eeafd",
                      "on-secondary": "#005f30",
                      "tertiary": "#8af2ff",
                      "on-secondary-container": "#e3ffe5",
                      "on-secondary-fixed": "#004a24",
                      "secondary-dim": "#7aeb9d",
                      "error": "#ff7351",
                      "surface-container-lowest": "#000000",
                      "surface-bright": "#2c2c2c",
                      "outline-variant": "#494847",
                      "primary-dim": "#00ec3b",
                      "surface-tint": "#9cff93",
                      "surface-container-low": "#131313",
                      "on-primary-fixed-variant": "#006513",
                      "primary-fixed-dim": "#00ec3b",
                      "secondary-fixed": "#89faaa",
                      "on-error": "#450900",
                      "on-primary-fixed": "#00440a",
                      "secondary": "#89faaa",
                      "on-primary-container": "#005a10",
                      "surface-variant": "#262626",
                      "tertiary-fixed-dim": "#00dbec",
                      "inverse-surface": "#fcf8f8",
                      "secondary-container": "#006d38",
                      "outline": "#777575",
                      "tertiary-container": "#0eeafd",
                      "on-primary": "#006413",
                      "primary-fixed": "#00fc40",
                      "error-container": "#b92902",
                      "inverse-on-surface": "#565554",
                      "surface": "#0e0e0e",
                      "on-surface-variant": "#adaaaa",
                      "surface-dim": "#0e0e0e",
                      "on-secondary-fixed-variant": "#006a36",
                      "on-error-container": "#ffd2c8",
                      "error-dim": "#d53d18",
                      "primary-container": "#00fc40"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Space Grotesk"
                      ],
                      "display": [
                              "Space Grotesk"
                      ],
                      "body": [
                              "Inter"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.body');
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Gradient Button */
        .btn-gradient {
            background: linear-gradient(135deg, theme('colors.primary'), theme('colors.primary-container'));
            color: theme('colors.on-primary');
        }
        .btn-gradient:hover {
            box-shadow: 0 0 4px theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col md:flex-row bg-background">
<!-- TopNavBar (Web Only) -->
<nav class="hidden md:flex bg-[#0e0e0e]/80 backdrop-blur-md fixed top-0 w-full z-50 justify-between items-center px-8 py-4 max-w-full mx-auto shadow-[0_0_32px_rgba(0,255,65,0.08)] bg-[#1a1919]" style="background-color: #1a1919;">
<div class="text-[#00FF41] text-2xl font-bold tracking-tighter text-white uppercase font-['Space_Grotesk'] tracking-tight">
            U-Ride
        </div>
<div class="flex gap-8">
<a class="text-zinc-400 hover:text-white transition-colors hover:bg-[#262626] transition-all duration-300 font-['Space_Grotesk'] tracking-tight" href="#">Buscar Viaje</a>
<a class="text-[#00FF41] border-b-2 border-[#00FF41] pb-1 hover:bg-[#262626] transition-all duration-300 font-['Space_Grotesk'] tracking-tight" href="#">Publicar Viaje</a>
</div>
<div class="flex gap-4 items-center text-[#00FF41]">
<button class="hover:bg-[#262626] transition-all duration-300 scale-95 active:scale-90 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="hover:bg-[#262626] transition-all duration-300 scale-95 active:scale-90 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto w-full max-w-2xl mx-auto md:pt-28 pt-8 pb-32 px-6">
<!-- Header -->
<header class="mb-10 text-center md:text-left">
<h1 class="font-headline text-display-lg font-bold text-on-surface tracking-tight mb-2">Publicar Viaje</h1>
<p class="font-body text-on-surface-variant text-sm">Organiza tu ruta y comparte el viaje.</p>
</header>
<!-- Form Card -->
<div class="rounded-xl shadow-[0_0_32px_rgba(156,255,147,0.02)]">
<form class="space-y-6 rounded-xl p-6 bg-[#1a1919]">
<!-- Origen & Destino (Bento Grid Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="my_location" data-weight="fill">my_location</span> Origen
                        </label>
<input class="w-full bg-surface-container-highest border-none rounded-md text-on-surface px-4 py-3 focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 placeholder-zinc-500 transition-colors" placeholder="Campus, Estación..." type="text"/>
</div>
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="pin_drop" data-weight="fill">pin_drop</span> Destino
                        </label>
<input class="w-full bg-surface-container-highest border-none rounded-md text-on-surface px-4 py-3 focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 placeholder-zinc-500 transition-colors" placeholder="Zona, Calle..." type="text"/>
</div>
</div>
<!-- Fecha & Hora -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="calendar_today">calendar_today</span> Fecha
                        </label>
<input class="w-full bg-surface-container-highest border-none rounded-md text-on-surface px-4 py-3 focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 color-scheme-dark" type="date"/>
</div>
<div class="space-y-2">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="schedule">schedule</span> Hora
                        </label>
<input class="w-full bg-surface-container-highest border-none rounded-md text-on-surface px-4 py-3 focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 color-scheme-dark" type="time"/>
</div>
</div>
<!-- Asientos & Precio -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-transparent">
<!-- Asientos Counter -->
<div class="bg-surface-container-highest rounded-lg p-4 flex flex-col justify-between">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="group">group</span> Asientos Disponibles
                        </label>
<div class="flex items-center justify-between bg-surface rounded-md p-2">
<button class="w-10 h-10 flex justify-center items-center rounded-md bg-surface-variant text-on-surface hover:bg-surface-bright transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<span class="font-headline text-xl font-bold text-on-surface">3</span>
<button class="w-10 h-10 flex justify-center items-center rounded-md bg-surface-variant text-on-surface hover:bg-surface-bright transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Precio -->
<div class="bg-surface-container-highest rounded-lg p-4 flex flex-col justify-between">
<label class="font-label text-sm text-on-surface-variant uppercase tracking-wide mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="payments">payments</span> Aporte sugerido
                        </label>
<div class="relative flex items-center">
<span class="absolute left-4 font-headline text-lg font-bold text-on-surface-variant">$</span>
<input class="w-full bg-surface border-none rounded-md text-on-surface pl-10 pr-4 py-4 text-xl font-headline font-bold focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 placeholder-zinc-600 transition-colors" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<!-- CTA -->
<div class="pt-6">
<button class="w-full bg-[#00FF41] text-[#0e0e0e] py-4 rounded-xl font-headline font-bold text-lg flex justify-center items-center gap-3 transition-all duration-300 transform active:scale-[0.98] hover:bg-[#00FF41]/90" type="submit">
<span class="material-symbols-outlined" data-icon="publish">publish</span>
                        Publicar Viaje
                    </button>
</div>
</form>
</div>
</main>
<!-- Bottom Nav Bar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full bg-[#131313] shadow-[0_-10px_32px_rgba(0,0,0,0.5)] z-50 px-6 py-4 flex justify-between items-center rounded-t-xl" style="background-color: #131313;">
<a class="flex flex-col items-center gap-1 text-zinc-500" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label text-[10px] uppercase">Buscar</span>
</a>
<a class="flex flex-col items-center gap-1 text-[#00FF41]" href="#">
<div class="bg-[#00FF41]/10 p-2 rounded-full mb-1">
<span class="material-symbols-outlined" data-icon="add_box" data-weight="fill">add_box</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 text-zinc-500" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-label text-[10px] uppercase">Avisos</span>
</a>
<a class="flex flex-col items-center gap-1 text-zinc-500" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label text-[10px] uppercase">Perfil</span>
</a>
</nav>
</body></html>
