[pytest]
# Directorio donde pytest busca las pruebas
testpaths = client/tests/selenium

# Patrones de archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto al ejecutar pytest
addopts =
    -v
    --tb=short
    --no-header

# Filtrar advertencias innecesarias
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
