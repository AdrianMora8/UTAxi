services:
  postgres_test:
    image: postgres:16-alpine
    container_name: utaxi_db_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: utaxi_test
      POSTGRES_USER: utaxi
      POSTGRES_PASSWORD: utaxi123
    ports:
      - "5437:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utaxi"]
      interval: 5s
      timeout: 5s
      retries: 5

  owasp_zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: utaxi_zap
    restart: unless-stopped
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/JSON/core/view/version/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
