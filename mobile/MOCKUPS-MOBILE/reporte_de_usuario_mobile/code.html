<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>U-Ride - Reportar Usuario</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#b92902",
                        "surface-container-lowest": "#000000",
                        "surface-tint": "#9cff93",
                        "primary-fixed": "#00fc40",
                        "on-primary-fixed-variant": "#006513",
                        "on-surface-variant": "#adaaaa",
                        "on-background": "#ffffff",
                        "primary-dim": "#00ec3b",
                        "error": "#ff7351",
                        "on-error-container": "#ffd2c8",
                        "inverse-primary": "#006f16",
                        "secondary-fixed-dim": "#7aeb9d",
                        "inverse-surface": "#fcf8f8",
                        "on-primary-fixed": "#00440a",
                        "on-secondary-fixed-variant": "#006a36",
                        "outline": "#777575",
                        "on-secondary-fixed": "#004a24",
                        "primary-container": "#00fc40",
                        "surface-container-low": "#131313",
                        "surface": "#0e0e0e",
                        "surface-dim": "#0e0e0e",
                        "tertiary-dim": "#00dbec",
                        "background": "#0e0e0e",
                        "on-tertiary-fixed-variant": "#005c64",
                        "on-secondary": "#005f30",
                        "secondary-dim": "#7aeb9d",
                        "surface-bright": "#2c2c2c",
                        "inverse-on-surface": "#565554",
                        "tertiary-fixed": "#0eeafd",
                        "primary-fixed-dim": "#00ec3b",
                        "on-surface": "#ffffff",
                        "on-primary-container": "#005a10",
                        "on-error": "#450900",
                        "error-dim": "#d53d18",
                        "surface-variant": "#262626",
                        "surface-container-highest": "#262626",
                        "surface-container-high": "#201f1f",
                        "outline-variant": "#494847",
                        "secondary-container": "#006d38",
                        "on-secondary-container": "#e3ffe5",
                        "on-tertiary-container": "#005159",
                        "tertiary-fixed-dim": "#00dbec",
                        "on-tertiary-fixed": "#003d42",
                        "primary": "#9cff93",
                        "secondary-fixed": "#89faaa",
                        "secondary": "#89faaa",
                        "tertiary-container": "#0eeafd",
                        "tertiary": "#8af2ff",
                        "on-tertiary": "#005b63",
                        "surface-container": "#1a1919",
                        "on-primary": "#006413"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Space Grotesk", "sans-serif"],
                        display: ["Space Grotesk", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col selection:bg-primary selection:text-on-primary pb-24">
<!-- Top Navigation Area (Mobile Focused) -->
<header class="bg-surface-container-low sticky top-0 z-50">
<div class="flex items-center justify-between px-6 py-5">
<button class="text-on-surface-variant hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-white">Reportar Usuario</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="flex-grow px-6 pt-8 pb-12 max-w-md mx-auto w-full flex flex-col gap-8">
<!-- Header / Reported User Info -->
<section class="flex flex-col items-center text-center gap-4">
<div class="relative">
<img alt="Reported User Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-surface-container" data-alt="Close up portrait photo of a male student with short dark hair, wearing a neutral colored hoodie. The lighting is slightly dramatic and moody, reflecting an urban night aesthetic. High contrast, sharp details. Incorporates the overall dark theme and subtle 'Acid Green' kinetic energy undertones of the U-Ride design system." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz0XOhB9VqtDwnp0IVAF6GenXfhtY8Trz9OZkw8Do67bHYP2AQ2RwojuO1MaGqv6CTumtocOH3aTVsyzbb84h__-mVc0LnhWcZ1zHkvRZZdC_py268Qx4IYyYcrwoul0qmavDsn-c4isdPBNhzKuZEhP4KNhcSM5KKA-qxHwP0MlKKJ2-QJrnuXxbmcyTU1P80VwvPBHrYDXXtIa18W55iA8EhErKnFq0O7TuXIxVGDT6OH_omj1n7aqO25T4cknUFiny_FyRJJkU"/>
<div class="absolute -bottom-2 -right-2 bg-error-container text-on-error-container p-1.5 rounded-full ring-4 ring-surface">
<span class="material-symbols-outlined text-lg">warning</span>
</div>
</div>
<div>
<h2 class="font-headline font-bold text-2xl text-white">Carlos M.</h2>
<p class="text-on-surface-variant text-sm mt-1">Conductor • Viaje del 14/10/2024</p>
</div>
</section>
<!-- Report Form -->
<form class="flex flex-col gap-6">
<!-- Reason Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-headline font-medium text-sm text-on-surface-variant" for="reason">Motivo del Reporte</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-highest text-white rounded-lg px-4 py-4 focus:outline-none focus:ring-1 focus:ring-primary/40 focus:bg-surface-bright transition-colors border-none text-base" id="reason" name="reason">
<option disabled="" selected="" value="">Selecciona un motivo...</option>
<option value="conducta">Conducta inapropiada</option>
<option value="conduccion">Conducción peligrosa</option>
<option value="vehiculo">Problemas con el vehículo</option>
<option value="pago">Inconvenientes de pago</option>
<option value="otro">Otro</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Description Textarea -->
<div class="flex flex-col gap-2">
<label class="font-headline font-medium text-sm text-on-surface-variant" for="description">Descripción Detallada</label>
<textarea class="w-full bg-surface-container-highest text-white rounded-lg px-4 py-3 focus:outline-none focus:ring-1 focus:ring-primary/40 focus:bg-surface-bright transition-colors border-none resize-none placeholder:text-on-surface-variant/50" id="description" name="description" placeholder="Proporciona todos los detalles posibles sobre lo sucedido..." rows="5"></textarea>
</div>
<!-- Evidence Upload -->
<div class="flex flex-col gap-2">
<label class="font-headline font-medium text-sm text-on-surface-variant">Evidencia Adjunta (Opcional)</label>
<div class="border border-dashed border-outline-variant/40 rounded-xl p-6 flex flex-col items-center justify-center text-center gap-3 bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
<div class="bg-surface-container-highest p-3 rounded-full text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add_photo_alternate</span>
</div>
<div>
<p class="font-medium text-white text-sm">Sube fotos o capturas</p>
<p class="text-xs text-on-surface-variant mt-1">Formatos soportados: JPG, PNG, PDF</p>
</div>
</div>
<!-- Example Thumbnail (Simulated state) -->
<div class="flex gap-3 mt-2 overflow-x-auto pb-2">
<div class="relative flex-shrink-0">
<img alt="Evidence thumbnail" class="w-16 h-16 rounded-lg object-cover border border-outline-variant/20" data-alt="A small square thumbnail image showing a blurry screenshot of a chat conversation on a smartphone screen, typical evidence in a ride-sharing dispute. Dark mode interface visible. Fits the overarching dark, moody, and slightly gritty 'Academic Kinetic' visual style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8awDcFkUA7TzsPORMhCdWhc0eeoMMeRAcosy-sHAvNbhnjH-_YQB7W-vcQuTocN6Qugu8_o2A0usGZdqGq_LFCRtzEnc2k92CAgcD-ArzhATocrzX8cEIF39ietW2INORNEo8R6NvIVjiP8E4mB-Q_3nLnT7wxkvzm9s0vRe8-MoDbRQqXhWBiEtP6o722j4XNQM20JpTaBrMV1z_5bXEO3V09Y7OZwpGswstccgyZQ9452inP6BG7BT47dsjVtHe2JZ0xln7cyk"/>
<button class="absolute -top-2 -right-2 bg-surface-container-highest text-white rounded-full p-0.5 shadow-lg border border-surface" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</div>
</form>
</main>
<!-- Bottom Fixed CTA -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-surface-container-low border-t border-surface shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.5)] z-40">
<button class="w-full bg-error text-on-error py-4 px-6 rounded-lg font-headline font-bold text-lg hover:bg-error-container hover:text-on-error-container transition-all active:scale-95 shadow-[0_0_24px_rgba(255,115,81,0.15)]">
            Enviar Reporte
        </button>
<p class="text-center text-xs text-on-surface-variant mt-3">Tu reporte será tratado de forma confidencial.</p>
</div>
</body></html>
