<body class="bg-surface text-on-surface font-body h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Main Canvas Content - Transactional, so no Nav/Footer -->
<main class="w-full max-w-md mx-auto p-6 flex flex-col items-center gap-10">
<!-- Back Button (Contextual departure) -->
<div class="w-full flex justify-start mb-4">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
</div>
<!-- Illustration/Icon -->
<div class="w-24 h-24 rounded-full bg-surface-container-low flex items-center justify-center mb-2 shadow-[0_0_32px_rgba(156,255,147,0.08)]">
<span class="material-symbols-outlined text-primary text-5xl icon-fill">mark_email_unread</span>
</div>
<!-- Header Text -->
<div class="text-center space-y-4 max-w-[300px]">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface">Verifica tu correo</h1>
<p class="font-body text-sm text-on-surface-variant leading-relaxed">
                Hemos enviado un código de 6 dígitos a <br/>
<span class="text-on-surface font-medium">estudiante@universidad.edu</span>
</p>
</div>
<!-- OTP Input Area -->
<form class="w-full flex flex-col gap-8 items-center mt-4">
<!-- 6 Boxes -->
<div class="flex gap-3 justify-center w-full">
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="w-12 h-16 bg-surface-container-highest border-none rounded-md text-center text-2xl font-headline font-bold text-on-surface focus:bg-surface-bright focus:ring-1 focus:ring-primary/40 transition-all outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<!-- Resend Link -->
<div class="text-center font-label text-sm">
<span class="text-on-surface-variant">¿No recibiste el código?</span>
<button class="text-primary hover:text-primary-container font-medium ml-1 transition-colors" type="button">Reenviar código</button>
</div>
<!-- Primary CTA -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg py-4 rounded-md shadow-[0_0_32px_rgba(156,255,147,0.08)] hover:shadow-[0_0_8px_rgba(156,255,147,0.4)] transition-all mt-4" type="submit">
                Verificar
            </button>
</form>
</main>
