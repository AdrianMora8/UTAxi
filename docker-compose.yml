services:
  postgres:
    image: postgres:16-alpine
    container_name: utaxi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: utaxi
      POSTGRES_USER: utaxi
      POSTGRES_PASSWORD: utaxi123
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utaxi"]
      interval: 5s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: utaxi_sonar
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: utaxi_server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://utaxi:utaxi123@postgres:5432/utaxi
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: utaxi_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  sonar_data:
  sonar_logs:
  sonar_extensions:
